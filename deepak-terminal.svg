<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
<title id="title">Deepak R Developer Terminal</title>
<desc id="desc">A realistic dark terminal UI with an ASCII portrait generated from Deepak's supplied image ASCII data, developer information, skills, projects, git status and mission.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10161f"/><stop offset="1" stop-color="#05080d"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#171f29"/><stop offset="1" stop-color="#111821"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity=".58"/></filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
      .mono{font-family:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .prompt{fill:#00e5ff;font-weight:700}.cmd{fill:#f8fafc}.out{fill:#cbd5e1}
      .muted{fill:#64748b}.green{fill:#4ade80}.blue{fill:#60a5fa}.cyan{fill:#67e8f9}
      .yellow{fill:#facc15}.purple{fill:#c084fc}
      .cursor{animation:blink 1s steps(1,end) infinite}
      .scan{animation:scan 8s linear infinite}
      @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
      @keyframes scan{0%{transform:translateY(-100px);opacity:0}10%{opacity:.28}50%{opacity:.08}90%{opacity:.28}100%{transform:translateY(980px);opacity:0}}
    </style>
</defs>
