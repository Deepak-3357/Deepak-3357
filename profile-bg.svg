<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0b1220"/>
    <stop offset="45%" stop-color="#111c36"/>
    <stop offset="100%" stop-color="#18213f"/>
  </linearGradient>
  <radialGradient id="cyan" cx="20%" cy="20%" r="60%">
    <stop offset="0%" stop-color="#22d3ee" stop-opacity=".22"/>
    <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="violet" cx="82%" cy="72%" r="58%">
    <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".18"/>
    <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" fill="none" stroke="#7dd3fc" stroke-opacity=".045"/>
  </pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <style>
    .p{animation:float 7s ease-in-out infinite}
    .p2{animation:float2 9s ease-in-out infinite}
    .glow{animation:pulse 4s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translate(0,0);opacity:.25}50%{transform:translate(0,-18px);opacity:.8}}
    @keyframes float2{0%,100%{transform:translate(0,0);opacity:.18}50%{transform:translate(14px,12px);opacity:.65}}
    @keyframes pulse{0%,100%{opacity:.12}50%{opacity:.3}}
  </style>
</defs>

<rect width="1600" height="900" rx="28" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#cyan)"/>
<rect width="1600" height="900" fill="url(#violet)"/>
<rect width="1600" height="900" fill="url(#grid)"/>

<g class="glow" filter="url(#blur)">
  <circle cx="260" cy="160" r="115" fill="#22d3ee"/>
  <circle cx="1320" cy="700" r="150" fill="#8b5cf6"/>
</g>

<g fill="#dbeafe">
  <circle class="p" cx="120" cy="115" r="2"/>
  <circle class="p2" cx="260" cy="300" r="1.5"/>
  <circle class="p" cx="420" cy="90" r="1.7"/>
  <circle class="p2" cx="590" cy="240" r="2"/>
  <circle class="p" cx="760" cy="120" r="1.4"/>
  <circle class="p2" cx="940" cy="330" r="1.8"/>
  <circle class="p" cx="1120" cy="180" r="1.5"/>
  <circle class="p2" cx="1270" cy="430" r="2"/>
  <circle class="p" cx="1450" cy="250" r="1.4"/>
  <circle class="p2" cx="1520" cy="650" r="1.8"/>
  <circle class="p" cx="1080" cy="790" r="1.5"/>
  <circle class="p2" cx="820" cy="690" r="2"/>
  <circle class="p" cx="500" cy="760" r="1.6"/>
  <circle class="p2" cx="220" cy="620" r="1.8"/>
  <circle class="p" cx="70" cy="820" r="1.3"/>
</g>

<path d="M0 610 C300 520 420 720 760 600 S1220 460 1600 570"
      fill="none" stroke="#38bdf8" stroke-opacity=".08" stroke-width="2"/>
<path d="M0 640 C300 550 430 750 770 630 S1240 490 1600 600"
      fill="none" stroke="#a78bfa" stroke-opacity=".055" stroke-width="1.5"/>
</svg>